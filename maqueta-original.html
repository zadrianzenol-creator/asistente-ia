<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistente</title>
<script>
  // Tema antes del primer pintado, para evitar parpadeo
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* Tokens: neutros del estilo de referencia + Link Blue. Modo oscuro derivado de las capturas. */
  :root {
    --carbon: #0d0d0d; --snow: #ffffff; --fog: #f9f9f9; --pewter: #5d5d5d; --stone: #8f8f8f;
    --mist: #ececec; --link: #007aff;

    --bg: var(--snow);
    --side: var(--fog);
    --text: var(--carbon);
    --muted: var(--pewter);
    --faint: var(--stone);
    --hover: var(--mist);
    --bubble: #f4f4f4;
    --comp: var(--snow);
    --line: rgba(0, 0, 0, .15);
    --soft-line: rgba(0, 0, 0, .08);
    --btn-bg: var(--carbon);
    --btn-fg: var(--snow);

    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    --side-w: 260px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #212121;
    --side: #181818;
    --text: #ececec;
    --muted: #b4b4b4;
    --faint: #8f8f8f;
    --hover: #2f2f2f;
    --bubble: #303030;
    --comp: #303030;
    --line: rgba(255, 255, 255, .14);
    --soft-line: rgba(255, 255, 255, .08);
    --btn-bg: #ececec;
    --btn-fg: #0d0d0d;
    --link: #5aa9ff;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-size: 16px; line-height: 1.5;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 10px; }

  .app { display: flex; height: 100dvh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--side-w); flex: none; background: var(--side);
    display: flex; flex-direction: column; padding: 8px;
    transition: margin-left .22s ease, transform .22s ease;
    z-index: 30;
  }
  .app[data-side="closed"] .sidebar { margin-left: calc(var(--side-w) * -1); visibility: hidden; transition: margin-left .22s ease, visibility 0s .22s; }
  .side-top { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 4px 0 8px; }
  .mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 10px; }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 6px 6px 6px 8px; min-height: 36px; border-radius: 10px;
    font-size: 14px; line-height: 1.43; text-align: left;
  }
  .nav-item:hover, .nav-item.active { background: var(--hover); }
  .nav-item .i { width: 18px; height: 18px; }
  .search-wrap { padding: 2px 0 4px; }
  .search-wrap input {
    width: 100%; height: 36px; border-radius: 10px; padding: 0 10px;
    background: var(--bg); border: 1px solid var(--soft-line); font-size: 14px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--line); }
  .group-label { font-size: 12px; color: var(--faint); padding: 16px 8px 6px; font-weight: 500; }
  .chat-list { flex: 1; overflow-y: auto; min-height: 0; margin: 0 -4px; padding: 0 4px; }
  .chat-list .nav-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty-list { font-size: 14px; color: var(--faint); padding: 6px 8px; }

  .side-foot { padding-top: 8px; }
  .profile { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; width: 100%; text-align: left; }
  .profile:hover { background: var(--hover); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--btn-bg); color: var(--btn-fg); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
  .profile b { display: block; font-size: 14px; font-weight: 500; line-height: 1.2; }
  .profile small { font-size: 12px; color: var(--faint); }

  .scrim { display: none; }

  /* ---------- Main ---------- */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  header { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px; }
  .only-closed { display: none; }
  .app[data-side="closed"] .only-closed { display: grid; }
  .model-wrap { position: relative; }
  .model-btn { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 10px; font-size: 18px; font-weight: 400; }
  .model-btn:hover, .model-btn[aria-expanded="true"] { background: var(--hover); }
  .model-btn .i { width: 16px; height: 16px; color: var(--faint); }
  .pop {
    position: absolute; top: 42px; left: 0; min-width: 260px; padding: 6px; z-index: 40;
    background: var(--bg); border: 1px solid var(--line); border-radius: 16px;
  }
  .pop[hidden] { display: none; }
  .pop button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 10px; text-align: left; }
  .pop button:hover { background: var(--hover); }
  .pop b { display: block; font-size: 14px; font-weight: 500; }
  .pop small { display: block; font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }

  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .thread { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
  .thread-inner { max-width: 768px; margin: 0 auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 28px; }
  .app[data-mode="home"] .thread { display: none; }
  .app[data-mode="home"] .stage { justify-content: center; padding-bottom: 12vh; }
  .app[data-mode="chat"] .hero, .app[data-mode="chat"] .chips { display: none; }
  .app[data-mode="home"] .note { display: none; }

  .msg.user { align-self: flex-end; max-width: 80%; }
  .bubble { background: var(--bubble); padding: 10px 18px; border-radius: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { display: flex; flex-direction: column; gap: 6px; }
  .content { overflow-wrap: anywhere; }
  .content > * + * { margin-top: 14px; }
  .content ul { padding-left: 22px; }
  .content li + li { margin-top: 6px; }
  .content li::marker { color: var(--faint); }
  .content code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .875em; background: var(--bubble); padding: .15em .4em; border-radius: 6px; }
  .content pre { background: var(--bubble); border-radius: 14px; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.6; }
  .content pre code { background: none; padding: 0; font-size: inherit; }
  .content a { color: var(--link); }
  .typing { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--text); margin-top: 6px; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(.7); opacity: .6; } 50% { transform: scale(1); opacity: 1; } }
  .actions { display: flex; gap: 2px; margin-left: -8px; opacity: 0; transition: opacity .15s; }
  .msg.bot:hover .actions, .msg.bot:focus-within .actions, .msg.bot.last .actions { opacity: 1; }
  .msg.bot.streaming .actions { visibility: hidden; }
  .actions .icon-btn { width: 32px; height: 32px; }
  .actions .i { width: 17px; height: 17px; }

  /* ---------- Composer ---------- */
  .dock { width: 100%; max-width: 768px; margin: 0 auto; padding: 0 20px calc(10px + env(safe-area-inset-bottom)); }
  .hero { font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -.015em; text-align: center; margin-bottom: 28px; }
  .composer {
    background: var(--comp); border: 1px solid var(--line); border-radius: 28px;
    padding: 12px 12px 10px 16px; display: flex; flex-direction: column; gap: 4px;
    transition: border-color .15s;
  }
  :root[data-theme="dark"] .composer { border-color: transparent; }
  .composer:focus-within { border-color: var(--faint); }
  .composer textarea {
    width: 100%; resize: none; border: 0; outline: 0; background: transparent;
    min-height: 28px; max-height: 200px; padding: 4px 4px 0; line-height: 1.5;
  }
  .composer textarea::placeholder { color: var(--muted); opacity: 1; }
  .tools { display: flex; align-items: center; gap: 2px; margin-left: -6px; }
  .tool-btn { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 18px; color: var(--muted); font-size: 14px; }
  .tool-btn:hover { background: var(--hover); color: var(--text); }
  .tool-btn.sq { width: 36px; padding: 0; justify-content: center; }
  .send {
    width: 36px; height: 36px; border-radius: 50%; background: var(--btn-bg); color: var(--btn-fg);
    display: grid; place-items: center; margin-left: 4px; transition: opacity .15s;
  }
  .send:disabled { opacity: .25; cursor: default; }
  .send .i { width: 18px; height: 18px; stroke-width: 2.2; }
  .send .i.fill { fill: currentColor; stroke: none; width: 14px; height: 14px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .chip { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  :root[data-theme="dark"] .chip { border-color: var(--soft-line); }
  .chip:hover { background: var(--hover); color: var(--text); }
  .note { text-align: center; font-size: 12px; color: var(--muted); padding-top: 10px; }

  .toast { position: fixed; bottom: 96px; left: 50%; transform: translate(-50%, 8px); background: var(--btn-bg); color: var(--btn-fg); font-size: 14px; padding: 8px 14px; border-radius: 12px; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Móvil ---------- */
  @media (max-width: 768px) {
    .sidebar { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); transition: transform .22s ease, visibility 0s; }
    .app[data-side="closed"] .sidebar { margin-left: 0; transform: translateX(-100%); visibility: hidden; transition: transform .22s ease, visibility 0s .22s; }
    .app[data-side="open"] .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 20; }
    .only-closed, .app[data-side="closed"] .only-closed { display: grid; }
    .app[data-side="open"] .only-closed { display: grid; }
    .hero { font-size: 22px; }
    .msg.user { max-width: 90%; }
    .composer textarea { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="app" id="app" data-mode="home" data-side="open">
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar" aria-label="Barra lateral">
    <div class="side-top">
      <span class="mark" aria-hidden="true"><svg class="i" data-ic="spark"></svg></span>
      <button class="icon-btn" id="closeSide" aria-label="Cerrar barra lateral"><svg class="i" data-ic="panel"></svg></button>
    </div>
    <nav>
      <button class="nav-item" id="newChat"><svg class="i" data-ic="edit"></svg>Nuevo chat</button>
      <button class="nav-item" id="searchBtn"><svg class="i" data-ic="search"></svg>Buscar chats</button>
      <div class="search-wrap" id="searchWrap" hidden><input id="searchInput" type="search" placeholder="Buscar…" aria-label="Buscar chats" autocomplete="off"></div>
      <button class="nav-item" id="libBtn"><svg class="i" data-ic="book"></svg>Biblioteca</button>
    </nav>
    <div class="group-label">Chats</div>
    <div class="chat-list" id="chatList" role="list"></div>
    <div class="side-foot">
      <button class="profile" aria-label="Cuenta">
        <span class="avatar">IN</span>
        <span><b>Invitado</b><small>Plan gratuito</small></span>
      </button>
    </div>
  </aside>

  <main>
    <header>
      <button class="icon-btn only-closed" id="openSide" aria-label="Abrir barra lateral"><svg class="i" data-ic="panel"></svg></button>
      <div class="model-wrap">
        <button class="model-btn" id="modelBtn" aria-haspopup="menu" aria-expanded="false"><span id="modelName">Asistente</span><svg class="i" data-ic="down"></svg></button>
        <div class="pop" id="modelPop" role="menu" hidden>
          <button role="menuitemradio" data-model="Asistente" aria-checked="true"><span><b>Asistente</b><small>Respuestas rápidas para el día a día</small></span><svg class="i" data-ic="check"></svg></button>
          <button role="menuitemradio" data-model="Asistente Pro" aria-checked="false"><span><b>Asistente Pro</b><small>Razona más antes de responder</small></span><svg class="i" data-ic="check" style="opacity:0"></svg></button>
        </div>
      </div>
      <span class="spacer"></span>
      <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema"><svg class="i" data-ic="moon" id="themeIc"></svg></button>
    </header>

    <section class="stage">
      <div class="thread" id="thread"><div class="thread-inner" id="threadInner"></div></div>

      <div class="dock">
        <h1 class="hero">¿Por dónde empezamos?</h1>
        <form class="composer" id="form" autocomplete="off">
          <textarea id="input" rows="1" placeholder="Pregunta lo que quieras" aria-label="Mensaje"></textarea>
          <div class="tools">
            <button type="button" class="tool-btn sq" aria-label="Adjuntar archivo" id="attachBtn"><svg class="i" data-ic="plus"></svg></button>
            <button type="button" class="tool-btn" id="toolsBtn"><svg class="i" data-ic="sliders"></svg>Herramientas</button>
            <span class="spacer"></span>
            <button type="button" class="tool-btn sq" aria-label="Dictar por voz" id="micBtn"><svg class="i" data-ic="mic"></svg></button>
            <button type="submit" class="send" id="send" aria-label="Enviar mensaje" disabled><svg class="i" data-ic="up"></svg></button>
          </div>
        </form>
        <div class="chips" id="chips">
          <button class="chip" type="button">Resumir un texto</button>
          <button class="chip" type="button">Explicar un concepto</button>
          <button class="chip" type="button">Escribir código</button>
          <button class="chip" type="button">Ideas para un proyecto</button>
        </div>
        <p class="note">El asistente puede cometer errores. Verifica la información importante.</p>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- Iconos (trazo, estilo outline) ---------- */
  var IC = {
    spark: '<path d="M12 3l1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9z"/>',
    panel: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/>',
    edit: '<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a1.9 1.9 0 0 1 3 3L12.4 14.6a2 2 0 0 1-.85.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.85z"/>',
    search: '<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/>',
    book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
    down: '<path d="m6 9 6 6 6-6"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
    mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
    up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
    stop: '<rect x="4" y="4" width="16" height="16" rx="3"/>',
    copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    up2: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88z"/>',
    down2: '<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88z"/>',
    redo: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>'
  };
  function icon(name, extra) {
    return '<svg class="i ' + (extra || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + IC[name] + '</svg>';
  }
  function paintIcons(root) {
    (root || document).querySelectorAll('svg[data-ic]').forEach(function (s) {
      s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
      s.innerHTML = IC[s.getAttribute('data-ic')] || '';
      s.removeAttribute('data-ic');
    });
  }
  paintIcons();

  /* ---------- Estado ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var app = $('app'), thread = $('thread'), inner = $('threadInner'), input = $('input'),
      sendBtn = $('send'), form = $('form'), list = $('chatList');

  var seed = [
    ['Ideas para el nombre de una app', 'Dame ideas de nombres para una app de hábitos.', 'Aquí van algunas direcciones:\n\n- **Ritmo**, corto y fácil de recordar\n- **Racha**, apunta a la constancia\n- **Paso a paso**, tono cercano\n\nSi me cuentas el público, afino la lista.'],
    ['Explicar la fotosíntesis', 'Explícame la fotosíntesis en pocas líneas.', 'Las plantas usan **luz solar**, agua y dióxido de carbono para producir glucosa y liberar oxígeno.\n\nOcurre en los cloroplastos, gracias a la clorofila.'],
    ['Plan de estudio semanal', 'Ayúdame a organizar una semana de estudio.', 'Una estructura simple:\n\n- Lunes y miércoles: teoría\n- Martes y jueves: práctica\n- Viernes: repaso y dudas\n\nBloques de 45 minutos con descansos cortos funcionan bien.']
  ];
  var chats = seed.map(function (s, i) {
    return { id: 's' + i, title: s[0], messages: [{ role: 'user', text: s[1] }, { role: 'bot', text: s[2] }] };
  });
  var current = null;           // chat activo (null = pantalla de inicio)
  var gen = null;               // generación en curso
  var uid = 0;

  /* ---------- Markdown mínimo y seguro ---------- */
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function md(text) {
    if ((text.match(/```/g) || []).length % 2) text += '\n```';   // bloque aún abierto mientras llega el texto
    var out = '', parts = text.split(/```/);
    parts.forEach(function (part, i) {
      if (i % 2) {
        var nl = part.indexOf('\n');
        out += '<pre><code>' + esc(nl >= 0 ? part.slice(nl + 1) : part).replace(/\n$/, '') + '</code></pre>';
      } else {
        part.split(/\n{2,}/).forEach(function (blk) {
          blk = blk.trim(); if (!blk) return;
          var lines = blk.split('\n');
          if (lines.every(function (l) { return /^- /.test(l); })) {
            out += '<ul>' + lines.map(function (l) { return '<li>' + inline(l.slice(2)) + '</li>'; }).join('') + '</ul>';
          } else { out += '<p>' + inline(blk).replace(/\n/g, '<br>') + '</p>'; }
        });
      }
    });
    return out;
  }

  /* ---------- Respuesta simulada ---------- */
  function fakeReply(prompt) {
    var q = prompt.length > 90 ? prompt.slice(0, 90) + '…' : prompt;
    return 'Esto es una **maqueta de interfaz**: no hay ningún modelo conectado, así que esta respuesta está escrita de antemano.\n\n' +
      'Tu mensaje fue: «' + q + '»\n\n' +
      'Lo que sí funciona aquí:\n\n' +
      '- Varios chats en la barra lateral, con búsqueda\n' +
      '- Respuesta que aparece poco a poco y se puede detener\n' +
      '- Copiar, regenerar y modo claro u oscuro\n' +
      '- `Enter` envía y `Shift + Enter` hace un salto de línea\n\n' +
      'Para conectarlo a un modelo real, reemplaza `fakeReply()` por una llamada a tu API:\n\n' +
      '```js\nasync function reply(messages) {\n  const res = await fetch("/api/chat", {\n    method: "POST",\n    body: JSON.stringify({ messages })\n  });\n  return res.body; // stream\n}\n```';
  }

  /* ---------- Render ---------- */
  function msgEl(m) {
    var d = document.createElement('div');
    if (m.role === 'user') {
      d.className = 'msg user';
      var b = document.createElement('div'); b.className = 'bubble'; b.textContent = m.text; d.appendChild(b);
    } else {
      d.className = 'msg bot';
      d.innerHTML = '<div class="content"></div><div class="actions">' +
        '<button class="icon-btn" data-act="copy" aria-label="Copiar">' + icon('copy') + '</button>' +
        '<button class="icon-btn" data-act="up" aria-label="Buena respuesta">' + icon('up2') + '</button>' +
        '<button class="icon-btn" data-act="down" aria-label="Mala respuesta">' + icon('down2') + '</button>' +
        '<button class="icon-btn" data-act="redo" aria-label="Regenerar">' + icon('redo') + '</button></div>';
      d.querySelector('.content').innerHTML = m.text ? md(m.text) : '<span class="typing" aria-label="Escribiendo"></span>';
    }
    return d;
  }
  function renderThread() {
    inner.innerHTML = '';
    if (!current) return;
    current.messages.forEach(function (m) { inner.appendChild(msgEl(m)); });
    markLast();
    thread.scrollTop = thread.scrollHeight;
  }
  function markLast() {
    var bots = inner.querySelectorAll('.msg.bot');
    bots.forEach(function (b) { b.classList.remove('last'); });
    if (bots.length) bots[bots.length - 1].classList.add('last');
  }
  function renderList() {
    var q = $('searchInput').value.trim().toLowerCase();
    var shown = chats.filter(function (c) { return !q || c.title.toLowerCase().indexOf(q) >= 0; });
    list.innerHTML = '';
    if (!shown.length) { list.innerHTML = '<div class="empty-list">Sin resultados</div>'; return; }
    shown.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'nav-item' + (current && current.id === c.id ? ' active' : '');
      b.setAttribute('role', 'listitem');
      b.innerHTML = '<span></span>'; b.firstChild.textContent = c.title;
      b.onclick = function () { stop(); open(c); if (isMobile()) setSide(false); };
      list.appendChild(b);
    });
  }
  function open(c) {
    current = c; app.dataset.mode = c ? 'chat' : 'home';
    renderThread(); renderList(); input.focus();
  }

  /* ---------- Generación ---------- */
  function setBusy(on) {
    sendBtn.innerHTML = on ? icon('stop', 'fill') : icon('up');
    sendBtn.setAttribute('aria-label', on ? 'Detener respuesta' : 'Enviar mensaje');
    sendBtn.disabled = on ? false : !input.value.trim();
  }
  function stop() {
    if (!gen) return;
    clearTimeout(gen.t); gen.el.classList.remove('streaming');
    if (!gen.msg.text) { gen.msg.text = '(Respuesta detenida)'; gen.el.querySelector('.content').innerHTML = md(gen.msg.text); }
    gen = null; setBusy(false);
  }
  function respond(chat, prompt) {
    var msg = { role: 'bot', text: '' };
    chat.messages.push(msg);
    var el = msgEl(msg); el.classList.add('streaming'); inner.appendChild(el); markLast();
    thread.scrollTop = thread.scrollHeight;
    var full = fakeReply(prompt), pos = 0, content = el.querySelector('.content');
    gen = { msg: msg, el: el, t: null }; setBusy(true);
    (function tick() {
      pos = Math.min(full.length, pos + 2 + Math.floor(Math.random() * 5));
      msg.text = full.slice(0, pos);
      var near = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80;
      content.innerHTML = md(msg.text);
      if (near) thread.scrollTop = thread.scrollHeight;
      if (pos >= full.length) { el.classList.remove('streaming'); gen = null; setBusy(false); return; }
      gen.t = setTimeout(tick, 22);
    })();
  }
  function send(text) {
    text = text.trim(); if (!text || gen) return;
    if (!current) {
      current = { id: 'c' + (++uid), title: text.length > 34 ? text.slice(0, 34) + '…' : text, messages: [] };
      chats.unshift(current); app.dataset.mode = 'chat'; inner.innerHTML = '';
    }
    current.messages.push({ role: 'user', text: text });
    inner.appendChild(msgEl({ role: 'user', text: text }));
    input.value = ''; grow(); renderList();
    thread.scrollTop = thread.scrollHeight;
    respond(current, text);
  }

  /* ---------- Eventos ---------- */
  function grow() {
    input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    if (!gen) sendBtn.disabled = !input.value.trim();
  }
  input.addEventListener('input', grow);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!gen) send(input.value); }
  });
  form.addEventListener('submit', function (e) { e.preventDefault(); if (gen) stop(); else send(input.value); });
  form.addEventListener('click', function (e) { if (e.target === form) input.focus(); });

  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    input.value = b.textContent + ': '; grow(); input.focus();
  });
  inner.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, el = b.closest('.msg');
    if (act === 'copy') {
      var idx = Array.prototype.indexOf.call(inner.children, el), m = current.messages[idx];
      var done = function () { b.innerHTML = icon('check'); setTimeout(function () { b.innerHTML = icon('copy'); }, 1400); };
      if (navigator.clipboard) navigator.clipboard.writeText(m.text).then(done, function () { toast('No se pudo copiar'); }); else toast('No se pudo copiar');
    } else if (act === 'up' || act === 'down') {
      b.style.color = 'var(--text)'; toast('Gracias por tu opinión');
    } else if (act === 'redo' && !gen) {
      var i = Array.prototype.indexOf.call(inner.children, el);
      var prev = current.messages[i - 1];
      current.messages.splice(i, 1); el.remove();
      respond(current, prev ? prev.text : '');
    }
  });

  $('newChat').onclick = function () { stop(); open(null); input.value = ''; grow(); if (isMobile()) setSide(false); };
  $('libBtn').onclick = function () { toast('La biblioteca no está disponible en esta demo'); };
  $('attachBtn').onclick = function () { toast('Adjuntar archivos no está disponible en esta demo'); };
  $('toolsBtn').onclick = function () { toast('Las herramientas no están disponibles en esta demo'); };
  $('micBtn').onclick = function () { toast('El dictado por voz no está disponible en esta demo'); };
  $('searchBtn').onclick = function () {
    var w = $('searchWrap'); w.hidden = !w.hidden;
    if (!w.hidden) $('searchInput').focus(); else { $('searchInput').value = ''; renderList(); }
  };
  $('searchInput').addEventListener('input', renderList);

  /* Sidebar */
  function isMobile() { return matchMedia('(max-width: 768px)').matches; }
  function setSide(open) { app.dataset.side = open ? 'open' : 'closed'; }
  $('closeSide').onclick = function () { setSide(false); };
  $('openSide').onclick = function () { setSide(true); };
  $('scrim').onclick = function () { setSide(false); };
  if (isMobile()) setSide(false);

  /* Selector de modelo */
  var pop = $('modelPop'), mbtn = $('modelBtn');
  function togglePop(v) { pop.hidden = !v; mbtn.setAttribute('aria-expanded', String(v)); }
  mbtn.onclick = function (e) { e.stopPropagation(); togglePop(pop.hidden); };
  pop.addEventListener('click', function (e) {
    var b = e.target.closest('[data-model]'); if (!b) return;
    $('modelName').textContent = b.dataset.model;
    pop.querySelectorAll('[data-model]').forEach(function (x) {
      var on = x === b; x.setAttribute('aria-checked', on); x.querySelector('svg').style.opacity = on ? 1 : 0;
    });
    togglePop(false);
  });
  document.addEventListener('click', function () { togglePop(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { togglePop(false); if (isMobile()) setSide(false); } });

  /* Tema */
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('theme', t); } catch (e) {}
    $('themeIc').innerHTML = IC[t === 'dark' ? 'sun' : 'moon'];
    $('themeBtn').setAttribute('aria-label', t === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
  }
  $('themeBtn').onclick = function () { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); };
  setTheme(document.documentElement.getAttribute('data-theme'));

  /* Aviso */
  var tt;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  renderList(); setBusy(false); input.focus();
})();
</script>
</body>
</html>
