# Plantilla para Fly.io. Cambia "app" por un nombre único y la región por la más cercana a tus usuarios.
# Claves:  fly secrets set GEMINI_API_KEY=...   (nunca en este archivo)
app = "asistente-ia"
primary_region = "mia"

[build]

[env]
  PORT = "8080"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
